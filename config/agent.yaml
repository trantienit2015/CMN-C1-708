# Agent Manifest — AgentRegistry entry point
# AgentRegistry reads every key below at ROOT level. Nesting them under an
# `agent:` block makes them invisible to the registry: namespace and enabled
# fall back to defaults and name/version never resolve.
id: "CMN-C1-708"
name: "GitLabWebhookAddAgent"
namespace: "cmn"
version: "0.1.0"
enabled: true
category: "Cat 1"
# Static generation contract — the InputParse step (Step 2) has a deterministic
# regex/keyword core that always produces a valid result (or a clean "no guess
# made" error); an LLM (Azure OpenAI) may additionally fill in a project
# reference / event flags / endpoint alias the deterministic core left blank.
# It only fills gaps, never overrides a deterministic match, and never relaxes
# the SSRF allowlist (see docs/02_design.md "Resolution core").
generation_mode: "llm"  # deterministic | llm
industry: "CMN"

# Base pattern reference (L1-direct inheritance; not an import target)
base_type: "ToolCallingAgent"

# Entry point — a single dotted import path (module.Class), not a module:/class:
# split. AgentRegistry does class.rsplit(".", 1) to get (module, class_name).
class: "src.graph.graph.GitLabWebhookAddGraph"

# Security
required_trust_level: "INTERNAL"

# Compile-time gates. Both lists are declared explicitly.
# secrets: 実行経路上で ctx.secrets.require() により解決される鍵をすべて挙げる。
# AZURE_OPENAI_*: resolved via InvocationContext.from_state(state).secrets.require(...)
# inside WebhookProvisionNode._llm_refine() (per-invocation, not cached). None of
# it lives in config/config.yaml — endpoint and deployment are secrets here, not
# runtime config, even though they are not credentials by themselves.
requires:
  secrets:
    - "gitlab_api_token"
    - "webhook_secret_token"
    - "AZURE_OPENAI_API_KEY"
    - "AZURE_OPENAI_ENDPOINT"
    - "AZURE_OPENAI_DEPLOYMENT"
  extras: ["openai"]  # AzureOpenAIClient wraps langchain_openai.ChatOpenAI

# Runtime parameters live in config/config.yaml. AgentRegistry loads that file
# separately and passes its contents as Graph(config=...).
